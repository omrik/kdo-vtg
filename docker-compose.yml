services:
  kdo-vtg:
    build: .
    container_name: kdo-vtg
    ports:
      - "8080:8000"
    volumes:
      - ./config:/app/config:rw
      - /Users/omrik/Movies:/media:ro
    environment:
      - TZ=Europe/Bucharest
      - PUID=1000
      - PGID=100
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    restart: unless-stopped
