services:
  kdo-vtg:
    build: .
    container_name: ${CONTAINER_NAME:-kdo-vtg}
    ports:
      - "${HOST_PORT:-8080}:8000"
    volumes:
      - ${KDO_CONFIG_DIR:-./config}:/app/config
      - ${MEDIA_PATH:-./media}:/media:ro
    environment:
      - TZ=${TZ:-UTC}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-100}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-}
    restart: unless-stopped