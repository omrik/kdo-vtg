services:
  kdo-vtg:
    image: ghcr.io/omrik/kdo-vtg:latest
    container_name: kdo-vtg
    # Start as root so the entrypoint can chown the config dir to PUID:PGID,
    # then the app drops to that user. Remove to run as the image's uid 1000.
    user: "0:0"
    ports:
      - "8080:8000"
    volumes:
      - kdo-vtg_config:/app/config
      - /volume1/media:/media:ro
    environment:
      - TZ=UTC
      - PUID=1000
      - PGID=100
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    restart: unless-stopped

volumes:
  kdo-vtg_config:
