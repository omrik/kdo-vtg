# UGOS App Center compose template for KDO Video Tagger.
# ./data resolves to the app data dir under the installation directory; the
# user-authorized media folders are injected by the system into
# ${UGAPP_SHARED_DIR} (requires allow_add_access_path). Parameter vars come
# from `parameters` in ../project.yaml. The image tag is pinned by
# scripts/build-upk.sh and must match the saved tar (never `latest`).
services:
  kdo-vtg:
    image: ghcr.io/omrik/kdo-vtg:0.6.20
    container_name: com.omrik.docker.kdovideotagger
    network_mode: bridge
    ports:
      - "${WEBUI_PORT}:8000"
    volumes:
      - ./data:/app/config:rw
      - ${UGAPP_SHARED_DIR}:/media:ro
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: always