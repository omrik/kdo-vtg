name: Build and Publish Docker Image

on:
  push:
    branches: [main, stage]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  DOCKERHUB_IMAGE: omrikedem/kdo-vtg

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      meta_tags: ${{ join(steps.meta.outputs.tags, ',') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.description=Self-hosted video metadata tagger: scan media folders, tag clips, detect scenes/objects/colors, local Whisper transcription, and Gemini chapter planning.
          annotations: |
            org.opencontainers.image.title=KDO Video Tagger
            org.opencontainers.image.description=Self-hosted video metadata tagger: scan media folders, tag clips, detect scenes/objects/colors, local Whisper transcription, and Gemini chapter planning.
            ${{ steps.meta.outputs.annotations }}

      - name: Sync Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          short-description: >-
            Self-hosted video metadata tagger: scan media folders, tag clips,
            detect scenes/objects/colors, local Whisper transcription, and
            Gemini chapter planning. Export CSV/Excel and EDL.
          readme-filepath: README.md

      - name: Set container package description
        if: env.PKG_PAT != ''
        continue-on-error: true
        env:
          PKG_PAT: ${{ secrets.ACTIONS_PAT }}
        run: |
          curl -s -o /dev/null -w "%{http_code}\n" -X PATCH \
            -H "Authorization: Bearer $PKG_PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/users/${{ github.repository_owner }}/packages/container/kdo-vtg" \
            -d '{"description":"Self-hosted video metadata tagger: scan media folders, tag clips, detect scenes/objects/colors, local Whisper transcription, and Gemini chapter planning. See https://github.com/omrik/kdo-vtg for full release notes and docs."}'

  smoke-arm64:
    runs-on: ubuntu-latest
    needs: build
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pull arm64 image
        env:
          META_TAGS: ${{ needs.build.outputs.meta_tags }}
        run: |
          IMG=$(printf '%s\n' "$META_TAGS" | tr ',' '\n' | grep -oE "${REGISTRY}/[^:]+:[0-9a-f]{7,40}" | head -1)
          [ -n "$IMG" ] || { echo "no sha tag found in meta_tags"; exit 1; }
          echo "Pulling ${IMG}"
          docker pull --platform linux/arm64 "${IMG}"
          echo "IMG=${IMG}" >> "$GITHUB_ENV"

      - name: Boot smoke test (arm64, qemu)
        run: |
          mkdir -p /tmp/kdo-smoke
          docker run -d --rm --platform linux/arm64 \
            --name kdo-smoke \
            -v /tmp/kdo-smoke:/app/config \
            -p 18080:8000 \
            "${IMG}"
          n=0
          until [ "$n" -ge 30 ]; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:18080/api/health || true)
            if [ "$code" = "200" ]; then
              curl -s http://localhost:18080/api/health
              docker rm -f kdo-smoke >/dev/null 2>&1 || true
              exit 0
            fi
            n=$((n+1)); sleep 3
          done
          docker logs kdo-smoke 2>&1 | tail -30
          docker rm -f kdo-smoke >/dev/null 2>&1 || true
          exit 1
