name: Build and Publish Docker Image

on:
  push:
    branches: [main, stage]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.description=Self-hosted video metadata tagger: scan media folders, tag clips, detect scenes/objects/colors, local Whisper transcription, and Gemini chapter planning.
          annotations: |
            org.opencontainers.image.title=KDO Video Tagger
            org.opencontainers.image.description=Self-hosted video metadata tagger: scan media folders, tag clips, detect scenes/objects/colors, local Whisper transcription, and Gemini chapter planning.
            ${{ steps.meta.outputs.annotations }}

      - name: Set container package description
        if: env.PKG_PAT != ''
        continue-on-error: true
        env:
          PKG_PAT: ${{ secrets.ACTIONS_PAT }}
        run: |
          curl -s -o /dev/null -w "%{http_code}\n" -X PATCH \
            -H "Authorization: Bearer $PKG_PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/users/${{ github.repository_owner }}/packages/container/kdo-vtg" \
            -d '{"description":"Self-hosted video metadata tagger (v0.6.5+): scan media folders, tag clips, detect scenes/objects/colors, local Whisper transcription, and Gemini chapter planning. See https://github.com/omrik/kdo-vtg for full release notes and docs."}'
